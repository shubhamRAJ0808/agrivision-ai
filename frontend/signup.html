<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — AgriVision AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="brand" style="margin-bottom:22px;"><span class="brand-mark">AV</span> AgriVision AI</div>
    <h1>Create your account</h1>
    <p class="auth-sub">Set up your farm dashboard in under a minute.</p>
    <div class="auth-error" id="errBox"></div>
    <form id="signupForm">
      <div class="field">
        <label>Full name</label>
        <input type="text" id="name" required autocomplete="name">
      </div>
      <div class="field">
        <label>Farm name (optional)</label>
        <input type="text" id="farmName" autocomplete="organization">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary auth-submit" id="submitBtn">Sign up</button>
    </form>
    <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>
<script src="assets/api.js"></script>
<script>
document.getElementById("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errBox = document.getElementById("errBox");
  const btn = document.getElementById("submitBtn");
  errBox.style.display = "none";
  btn.textContent = "Creating account…";
  btn.disabled = true;
  try {
    const data = await apiFetch("/api/auth/signup", {
      method: "POST",
      body: JSON.stringify({
        name: document.getElementById("name").value,
        farm_name: document.getElementById("farmName").value || null,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      }),
    });
    setSession(data.access_token, data.user);
    window.location.href = "app.html";
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = "block";
  } finally {
    btn.textContent = "Sign up";
    btn.disabled = false;
  }
});
</script>
</body>
</html>
